---
- name: Check supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] | default('') == 'OpenBSD'
    fail_msg: This role supports OpenBSD only and requires gathered distribution facts.

- name: Check adblock remote-control settings
  ansible.builtin.assert:
    that:
      - unbound_remote_control_enable | bool
      - >-
        unbound_remote_control_use_cert | bool or
        unbound_remote_control_interface in ['127.0.0.1', '::1'] or
        unbound_remote_control_interface.startswith('/')
    fail_msg: >-
      Adblocking requires remote control. Enable it and use a loopback address,
      a local socket, or certificate authentication for a network interface.
  when: unbound_adblock

- name: Disable managed adblock activity
  when: not unbound_adblock
  block:
    - name: Check whether the adblock account exists
      ansible.builtin.getent:
        database: passwd
        key: _adblock
        fail_key: false

    - name: Remove unbound-adblock crontab entry
      ansible.builtin.cron:
        name: "Update unbound-adblock zone"
        user: _adblock
        state: absent
      when: ansible_facts.getent_passwd['_adblock'] is not none

    - name: Check for the doas configuration
      ansible.builtin.stat:
        path: "{{ doas_config_file | default('/etc/doas.conf') }}"
        get_checksum: false
      register: adblock_doas_config

    - name: Read existing doas rulesets
      ansible.builtin.slurp:
        src: "{{ doas_config_file | default('/etc/doas.conf') }}"
      register: adblock_doas_rules
      no_log: true
      when: adblock_doas_config.stat.exists

    - name: Remove managed doas rules for _adblock
      ansible.builtin.include_role:
        name: sjktje.doas
        tasks_from: rules
      vars:
        doas_rules_name: unbound adblock
        doas_rules_state: absent
      when:
        - adblock_doas_config.stat.exists
        - >-
          '# BEGIN ANSIBLE MANAGED DOAS: unbound adblock' in
          (adblock_doas_rules.content | b64decode).splitlines()

- name: Add _adblock user
  ansible.builtin.user:
    name: _adblock
    shell: /sbin/nologin
    home: /var/empty
    system: yes
    create_home: no
    state: present
  when: unbound_adblock

- name: Create /var/unbound/db/adblock.rpz with proper permissions
  ansible.builtin.file:
    name: /var/unbound/db/adblock.rpz
    owner: _adblock
    group: wheel
    mode: '0644'
    state: touch
    modification_time: preserve
    access_time: preserve
  when: unbound_adblock

- name: Check whether the adblock zone needs initial generation
  ansible.builtin.stat:
    path: /var/unbound/db/adblock.rpz
    get_checksum: false
  register: adblock_zone
  when: unbound_adblock

- name: Create log directory for unbound-adblock
  ansible.builtin.file:
    name: /var/log/unbound-adblock
    owner: root
    group: wheel
    mode: '0755'
    state: directory
  when: unbound_adblock

- name: Create log file
  ansible.builtin.file:
    name: /var/log/unbound-adblock/unbound-adblock.log
    owner: _adblock
    group: wheel
    mode: '0640'
    state: touch
    modification_time: preserve
    access_time: preserve
  when: unbound_adblock

# Upstream checks that both log paths are writable before rotating either file.
- name: Create gzipped log file
  ansible.builtin.file:
    name: /var/log/unbound-adblock/unbound-adblock.log.0.gz
    owner: _adblock
    group: wheel
    mode: '0640'
    state: touch
    modification_time: preserve
    access_time: preserve
  when: unbound_adblock

- name: Install and configure unbound-adblock
  block:
    - name: Download unbound-adblock
      ansible.builtin.get_url:
        url: https://geoghegan.ca/pub/unbound-adblock/0.5/unbound-adblock.sh
        checksum: sha256:106e2d94fccf543ae2103c8068cae700791ea02a46e46a2a190bf91d2594bcd8
        dest: /usr/local/bin/unbound-adblock
        mode: '0755'
        owner: root
        group: bin
      register: adblock_download

    - name: Add doas rules for _adblock
      ansible.builtin.include_role:
        name: sjktje.doas
        tasks_from: rules
      vars:
        doas_rules_name: unbound adblock
        doas_rules:
          - action: permit
            options: [nopass]
            identity: _adblock
            as: root
            cmd: /usr/sbin/unbound-control
            args: "-q status"

          - action: permit
            options: [nopass]
            identity: _adblock
            as: root
            cmd: /usr/sbin/unbound-control
            args: "-q flush_zone unbound-adblock"

          - action: permit
            options: [nopass]
            identity: _adblock
            as: root
            cmd: /usr/sbin/unbound-control
            args: "-q auth_zone_reload unbound-adblock"

    - name: Install ripgrep and mawk for greatly improved performance
      ansible.builtin.package: 
        name: "{{ item }}"
        state: present
      loop: 
        - ripgrep
        - mawk

    - name: Install whitelist
      ansible.builtin.template:
        src: whitelist.txt.j2
        dest: "{{ unbound_whitelist_file }}"
        mode: "0600"
        owner: _adblock
      register: adblock_whitelist
  when: unbound_adblock

- name: Setup unbound-control keys
  ansible.builtin.command: "unbound-control-setup"
  args:
    creates: "/var/unbound/etc/unbound_control.pem"
  when:
    - unbound_remote_control_enable | bool
    - unbound_remote_control_use_cert | bool
    - not unbound_remote_control_interface.startswith('/')

- name: install unbound.conf
  ansible.builtin.template:
    src: unbound.conf.j2
    dest: "{{ unbound_conf }}"
    validate: "{{ unbound_checkconf_bin }} %s"
  notify: restart unbound

- name: Enable and start unbound
  ansible.builtin.service:
    name: unbound
    enabled: yes
    state: started
  tags: unbound

- name: Apply configuration changes before generating the adblock zone
  ansible.builtin.meta: flush_handlers
  when: unbound_adblock

- name: Update unbound-adblock zone
  ansible.builtin.command:
    argv:
      - /usr/local/bin/unbound-adblock
      - -O
      - openbsd
      - -w
      - "{{ unbound_whitelist_file }}"
  environment:
    PATH: /usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/usr/local/sbin
  become: yes
  become_user: _adblock
  become_method: community.general.doas
  when:
    - unbound_adblock
    - >-
      adblock_download.changed or adblock_whitelist.changed or
      adblock_zone.stat.size | default(0) == 0

- name: Add unbound-adblock crontab
  ansible.builtin.cron:
    name: "Update unbound-adblock zone"
    user: _adblock
    minute: '~'
    hour: '0~1'
    job: >-
      -s PATH=/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/bin:/usr/local/sbin
      /usr/local/bin/unbound-adblock -O openbsd -w {{ unbound_whitelist_file | quote }}
  when: unbound_adblock
